[package]
name = "specular-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
libc = "0.2"
zstd = { version = "0.13", default-features = false }
specular-core = { path = "../specular-core" }

[build-dependencies]
cc = "1"

[dev-dependencies]
specular-linux = { path = "../specular-linux" }
tempfile = "3"
crc32fast = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
