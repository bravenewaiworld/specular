[package]
name = "specular-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
crc32fast = "1"
libc = "0.2"
serde_json = "1"
zstd = { version = "0.13", default-features = false }
specular-core = { path = "../specular-core" }
# `process::command`, for starting a native core.
specular-linux = { path = "../specular-linux" }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
