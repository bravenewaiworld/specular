[package]
name = "specular-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
crc32fast = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
