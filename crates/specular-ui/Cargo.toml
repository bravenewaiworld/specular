[package]
name = "specular-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# Slint's text layout (fontique) uses fontconfig for system fonts; load it at runtime, if present,
# instead of linking it, since Specular ships its own fonts. Must match the fontique Slint uses.
fontique = { version = "0.11", features = ["fontconfig-dlopen"] }
# Box art: PNG and JPEG in, PNG out. Slint itself uses image with these two formats.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-femtovg"] }
# Only for the counts of its text layout cache's misses in the frame statistics (see
# `text_layout_misses`). Slint's internal crate: pinned to the same version as `slint`.
i-slint-core = { version = "=1.18.1", default-features = false, features = ["testing"] }
specular-core = { path = "../specular-core" }
specular-runtime = { path = "../specular-runtime" }
glow = "0.18"
ureq = { version = "3.4.2", default-features = false }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
tempfile = "3"
