[package]
name = "specular-brick"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# The code uses EGL 1.4 (what the driver offers); khronos-egl 6.0.0 fails to build without "1_5".
khronos-egl = { version = "6.0.0", default-features = false, features = ["1_5", "dynamic"] }
libc = "0.2"
libloading = "0.8"
specular-core = { path = "../../crates/specular-core" }
specular-linux = { path = "../../crates/specular-linux" }
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-femtovg"] }
# Slint's text layout (fontique) uses fontconfig for system fonts; load it at runtime, if present,
# instead of linking it, since Specular ships its own fonts. Must match the fontique Slint uses.
fontique = { version = "0.11", features = ["fontconfig-dlopen"] }

[dev-dependencies]
glow = "0.18"
