[package]
name = "specular-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "specular"
path = "src/main.rs"

[dependencies]
# Slint's desktop window (winit), drawn with the same renderer as on devices.
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg"] }
specular-core = { path = "../../crates/specular-core" }
specular-ui = { path = "../../crates/specular-ui" }
