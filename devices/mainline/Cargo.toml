[package]
name = "specular-mainline"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
libc = "0.2"
specular-core = { path = "../../crates/specular-core" }
specular-crystaline = { path = "../../crates/specular-crystaline" }
specular-linux = { path = "../../crates/specular-linux" }
specular-ui = { path = "../../crates/specular-ui" }
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-femtovg"] }

[build-dependencies]
specular-credits = { path = "../../crates/specular-credits" }

[dev-dependencies]
glow = "0.18"

[[bin]]
name = "specular"
path = "src/main.rs"
